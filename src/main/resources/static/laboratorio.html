<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Clínico - Asilo Cabeza de Algodón</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-header { font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navbar Superior con Usuario y Botón Cerrar Sesión -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-hospital me-2"></i>Asilo Cabeza de Algodón
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 fw-semibold">
                    <i class="bi bi-person-circle me-1"></i>
                    <span id="info-usuario">Laboratorio Clínico</span>
                </span>
                <button class="btn btn-outline-light btn-sm fw-bold" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Encabezado de Sección -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-journal-medical text-primary me-2"></i>Gestión de Exámenes de Laboratorio</h2>
            <button class="btn btn-outline-primary" onclick="cargarExamenesLaboratorio()">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar Lista
            </button>
        </div>

        <!-- Panel de Buscador y Filtros -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="inputBuscador" class="form-control" 
                                   placeholder="Buscar por nombre de paciente, examen o # de solicitud..." 
                                   onkeyup="filtrarExamenes()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="selectFiltroEstado" class="form-select" onchange="filtrarExamenes()">
                            <option value="TODOS">Todos los estados</option>
                            <option value="ORDENADO" selected>Solo ORDENADOS (Pendientes)</option>
                            <option value="REALIZADO">Solo REALIZADOS</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de Exámenes -->
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-list-check me-1"></i> Lista de Exámenes Pendientes y Procesados
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th># Solicitud</th>
                                <th>Paciente</th>
                                <th>Examen Solicitado</th>
                                <th>Costo (Q)</th>
                                <th>Estado</th>
                                <th>Resultado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaExamenes">
                            <!-- Se llena dinámicamente desde app-laboratorio.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Cargar Resultados y Costo -->
    <div class="modal fade" id="modalProcesarExamen" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Registrar Resultado y Costo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formProcesarExamen" onsubmit="guardarResultadoExamen(event)">
                    <div class="modal-body">
                        <input type="hidden" id="modalIdExamen">
                        <input type="hidden" id="modalIdVisita">

                        <div class="mb-3">
                            <label class="form-label text-muted mb-1">Paciente:</label>
                            <input type="text" id="modalPaciente" class="form-control fw-bold bg-light" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted mb-1">Examen Solicitado:</label>
                            <input type="text" id="modalNombreExamen" class="form-control fw-bold bg-light" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="modalCostoExamen" class="form-label fw-bold">Costo del Examen (Q):</label>
                            <input type="number" step="0.01" min="0" id="modalCostoExamen" class="form-control" required placeholder="Ej. 150.00">
                        </div>

                        <div class="mb-3">
                            <label for="modalResultado" class="form-label fw-bold">Resultado / Observaciones Clínicas:</label>
                            <textarea id="modalResultado" class="form-control" rows="4" required placeholder="Ingrese los valores de laboratorio o el diagnóstico final..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Guardar y Completar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Script Principal de Laboratorio -->
    <script src="app-laboratorio.js"></script>
</body>
</html>
