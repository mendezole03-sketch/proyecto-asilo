<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes - Asilo Cabeza de Algodón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra de navegación con datos del usuario -->
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand mb-0 h1">🏥 Asilo Cabeza de Algodón</span>
        <div class="d-flex align-items-center gap-3 text-white">
            <span id="info-usuario" class="fw-bold">Cargando usuario...</span>
            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded">
            <h2 class="header-titulo m-0">Listado de Pacientes</h2>
            <button class="btn btn-verde shadow-sm" onclick="cargarPacientes()">
                ↻ Actualizar Tabla
            </button>
        </div>

        <div class="card card-custom shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="tabla-cabecera">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Diagnóstico Inicial</th>
                            <th>Familiar Responsable</th>
                            <th>Médico Asignado</th>
                            <th>Fecha Ingreso</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-pacientes">
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
