<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia - Asilo Cabeza de Algodón</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style> body { background-color: #f8f9fa; } </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-capsule me-2"></i>Asilo Cabeza de Algodón - Farmacia
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 fw-semibold">
                    <i class="bi bi-person-circle me-1"></i>
                    <span id="info-usuario">Farmacéutico</span>
                </span>
                <button class="btn btn-outline-light btn-sm fw-bold" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-prescription2 text-success me-2"></i>Despacho de Medicamentos</h2>
            <button class="btn btn-outline-success" onclick="cargarRecetasFarmacia()">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
            </button>
        </div>

        <!-- Filtros -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="inputBuscador" class="form-control" 
                               placeholder="Buscar por paciente, medicamento o # visita..." onkeyup="filtrarRecetas()">
                    </div>
                    <div class="col-md-4">
                        <select id="selectFiltroEstado" class="form-select" onchange="filtrarRecetas()">
                            <option value="TODOS">Todos los estados</option>
                            <option value="RECETADO" selected>Pendientes de Despacho</option>
                            <option value="DESPACHADO">Despachados</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white fw-bold">
                <i class="bi bi-list-check me-1"></i> Recetas Médicas Solicitadas
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th># Visita</th>
                                <th>Paciente</th>
                                <th>Medicamento</th>
                                <th>Dosis / Días</th>
                                <th>Costo (Q)</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaRecetas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Despachar -->
    <div class="modal fade" id="modalDespachar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi bi-capsule-pills me-2"></i>Despachar Medicamento</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formDespachar" onsubmit="guardarDespacho(event)">
                    <div class="modal-body">
                        <input type="hidden" id="modalIdReceta">
                        
                        <div class="mb-3">
                            <label class="form-label text-muted mb-1">Paciente:</label>
                            <input type="text" id="modalPaciente" class="form-control bg-light fw-bold" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted mb-1">Medicamento y Dosis:</label>
                            <input type="text" id="modalMedicamento" class="form-control bg-light fw-bold" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="modalCosto" class="form-label fw-bold">Costo del Medicamento (Q):</label>
                            <input type="number" step="0.01" min="0" id="modalCosto" class="form-control" required placeholder="Ej. 75.50">
                        </div>
                        <div class="mb-3">
                            <label for="modalObservaciones" class="form-label fw-bold">Observaciones / Lote / Indicaciones:</label>
                            <textarea id="modalObservaciones" class="form-control" rows="3" placeholder="Lote, fecha de vencimiento o notas..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success fw-bold">Confirmar Despacho</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app-farmacia.js"></script>
</body>
</html>
